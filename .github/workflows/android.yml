name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix -- --legacy-peer-deps
      - run: npm ls expo-gl expo-three three expo-asset expo-file-system --depth=0 || true
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HafizBahcesi-apk
          path: android/app/build/outputs/apk/release/*.apk
